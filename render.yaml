# Render blueprint — see README "Deployment (Render)".
# SQLite is a file, so a persistent disk keeps the database across deploys.
# NOTE: Render persistent disks require a paid instance type (plan: starter, ~$7/mo).
# On the free tier there is no disk and the database resets on deploy/restart —
# you would re-run `bin/rails db:seed` after each deploy.
services:
  - type: web
    name: acme-payroll
    runtime: ruby
    plan: starter
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      bundle install
    # db:prepare runs pending migrations at boot, on the mounted disk.
    startCommand: bin/rails db:prepare && bin/rails server
    healthCheckPath: /api/v1/health
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/production.sqlite3
    disk:
      name: acme-payroll-data
      mountPath: /var/data
      sizeGB: 1
